name: Sabrix
description: >-
  Sabrix was a transaction (indirect / sales & use) tax determination and
  compliance software company whose engine calculated sales, use, VAT and GST
  taxes for enterprise ERP and billing systems. Sabrix was acquired by Thomson
  Reuters in 2009 and folded into the Thomson Reuters ONESOURCE Indirect Tax
  product line. As an independent brand Sabrix no longer operates: the sabrix.com
  domain is now owned by Thomson Reuters (Thomson Reuters nameservers) and issues
  a 301 redirect to tax.thomsonreuters.com/en/onesource/indirect-tax. This profile
  is retained in the API Evangelist network as a historical fintech / tax-tech
  lead; there is no independent Sabrix developer portal, API reference, OpenAPI
  definition, SDK, or well-known surface to enrich. Any live tax API surface lives
  under the Thomson Reuters ONESOURCE brand.
